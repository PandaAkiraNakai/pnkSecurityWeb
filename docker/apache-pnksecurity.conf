# Raíz web de PNKSecurity (ES3, punto 1).
<Directory /var/www/public>
    Options -Indexes -FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# Defensa en profundidad: aunque algo quede dentro de la raíz por error, no se sirven
# archivos ocultos (.env, .git, .htaccess) ni respaldos, volcados o configuración.
<LocationMatch "/\.">
    Require all denied
</LocationMatch>
<FilesMatch "\.(sql|bak|old|orig|swp|env|ini|log|sh|ya?ml|md|lock|dist)$|~$">
    Require all denied
</FilesMatch>
