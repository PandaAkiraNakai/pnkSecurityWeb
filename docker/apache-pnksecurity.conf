# Raíz web de PNKSecurity (ES3, punto 1).
<Directory /var/www/public>
    Options -Indexes -FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# Defensa en profundidad: aunque algo quede dentro de la raíz por error, no se sirven
# archivos ocultos (.env, .git, .htaccess) ni respaldos, volcados o configuración.
<LocationMatch "/\.">
    Require all denied
</LocationMatch>
<FilesMatch "\.(sql|bak|old|orig|swp|env|ini|log|sh|ya?ml|md|lock|dist)$|~$">
    Require all denied
</FilesMatch>

# ES3: cabeceras de seguridad en todas las respuestas (también en errores).
# - nosniff: el navegador no reinterpreta un archivo como script o estilo por su contenido.
# - X-Frame-Options y frame-ancestors: la app no se puede incrustar en otro sitio (clickjacking).
# - CSP: solo se cargan scripts, estilos y fuentes propios (sin CDN ni estilos en línea) y los
#   formularios solo se envían a este mismo sitio; si se colara un <script> en un comentario,
#   el navegador lo bloquearía.
# - HSTS lo agrega el proxy con TLS (Caddy, en AWS), que es quien sirve el HTTPS.
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
</IfModule>

# ES3 (AWS): detrás de Caddy, la IP real del cliente llega en X-Forwarded-For. Solo se acepta
# esa cabecera si viene de la red interna de Docker (donde está Caddy); así REMOTE_ADDR, que
# se guarda en intentos_login, es la IP del cliente y no la del proxy.
<IfModule mod_remoteip.c>
    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy 172.16.0.0/12
</IfModule>
